<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>百纳</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <span class="brand">百纳</span>
      <span class="top-status">
        <span class="connection starting" id="connection" aria-live="polite">检测连接…</span>
        <span class="count" id="count"></span>
        <button class="linkish" id="refreshConnection" type="button">重连</button>
      </span>
    </header>

    <p class="connection-detail" id="connectionDetail" aria-live="polite"></p>

    <section class="page-meta" id="pageMeta">
      <div class="thumb" id="thumb" aria-hidden="true"></div>
      <div class="meta">
        <h1 class="title" id="title">加载中…</h1>
        <p class="url" id="url"></p>
      </div>
    </section>

    <section class="output-options" aria-label="下载输出偏好">
      <label>输出 <select id="outputMode"><option value="video">视频 / 原媒体</option><option value="audio">音频（MP3）</option></select></label>
      <label>网页清晰度偏好 <select id="qualityPreference"><option value="best">最高可用</option><option value="1080p">不超过 1080p</option><option value="720p">不超过 720p</option></select></label>
      <p id="outputHint">清晰度仅用于网页解析，实际取决于站点。检测媒体不能切换清晰度。</p>
    </section>

    <div class="toolbar" id="toolbar" hidden>
      <button type="button" class="linkish" id="selectAll">全选</button>
      <button type="button" class="linkish" id="selectNone">清空</button>
    </div>

    <ul class="media-list" id="mediaList" hidden></ul>

    <p class="empty" id="empty" hidden>
      未检测到媒体。请先在页面中播放视频，再打开本弹窗。
    </p>

    <p class="status" id="status" hidden></p>

    <div class="actions">
      <button type="button" class="primary" id="enqueue" disabled>下载检测媒体</button>
      <button type="button" class="secondary" id="enqueuePage" disabled>
        解析本页视频
      </button>
    </div>

    <p class="hint">检测媒体直接下载；网页解析会重新读取页面。也可右键发送。</p>

    <section class="recent" id="recentSection" hidden>
      <div class="recent-head">
        <span class="recent-title" id="recentTitle">最近发送</span>
        <span class="recent-active" id="recentActive" hidden></span>
      </div>
      <ul class="recent-list" id="recentList"></ul>
    </section>

    <label class="pref">
      <input type="checkbox" id="inpageButtonToggle" checked />
      <span>页内下载按钮</span>
    </label>

    <script src="shared.js"></script>
    <script src="delivery-state.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
