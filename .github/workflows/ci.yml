name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      package_mode:
        description: "安装包模式：云端模式不需要 Telegram 应用凭据；原生模式需要仓库 Secrets"
        required: true
        default: cloud-only
        type: choice
        options:
          - cloud-only
          - native

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run pytest (mainline)
        run: pytest tests/core tests/data tests/sidecar tests/cli -q

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        if: matrix.os == 'windows-latest'
        run: npm.cmd ci
      - name: Install dependencies (Unix)
        if: matrix.os != 'windows-latest'
        run: npm ci
      - name: Typecheck and build
        if: matrix.os == 'windows-latest'
        run: npm.cmd run build
      - name: Typecheck and build (Unix)
        if: matrix.os != 'windows-latest'
        run: npm run build
      - name: Unit tests
        if: matrix.os == 'windows-latest'
        run: npm.cmd test
      - name: Unit tests (Unix)
        if: matrix.os != 'windows-latest'
        run: npm test
      - name: Package smoke helper tests
        run: >-
          node --test
          ../scripts/package_smoke_helpers.test.mjs
          ../scripts/test_packaged_media_tools.test.mjs
          ../scripts/windows_media_lock.test.mjs

  browser-extension:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Extension tests
        working-directory: browser-extension
        run: |
          node shared.test.js
          node sniff-core.test.js
          node bridge-timeout.test.js
          node install-ui.test.js
      - name: Package verified extension
        id: extension_package
        shell: bash
        run: |
          version="$(node -p "require('./browser-extension/manifest.json').version")"
          ./scripts/build_chrome_extension_zip.sh "$RUNNER_TEMP"
          echo "artifact=$RUNNER_TEMP/Downany-chrome-extension-$version.zip" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload verified extension
        uses: actions/upload-artifact@v7
        with:
          name: downany-chrome-extension-${{ steps.extension_package.outputs.version }}
          if-no-files-found: error
          path: ${{ steps.extension_package.outputs.artifact }}

  # Native resources are expensive and require platform-specific toolchains.
  # A release tag always produces a usable cloud-only package; native mode is
  # opt-in on workflow_dispatch because it requires Telegram application
  # credentials that are not needed by the cloud Bot API path.
  native-resources:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
          - os: macos-14
            target: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Verify retained Windows media lock
        if: matrix.target == 'win32-x64'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/windows_media_lock.mjs
      - name: Fetch paired media tools (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/fetch_release_binaries.ps1
      - name: Fetch paired media tools (macOS)
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: ./scripts/fetch_release_binaries.sh
      - name: Smoke-test fetched media tools (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: node scripts/test_packaged_media_tools.mjs "--bin-dir=$env:GITHUB_WORKSPACE\desktop\resources\bin"
      - name: Smoke-test fetched media tools (macOS)
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: node scripts/test_packaged_media_tools.mjs --bin-dir="$GITHUB_WORKSPACE/desktop/resources/bin"
      - name: Install real-media integration dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Verify real media postprocessing
        env:
          DOWNANY_BIN_DIR: ${{ github.workspace }}/desktop/resources/bin
          DOWNANY_REQUIRE_MEDIA_INTEGRATION: "1"
        run: python -m pytest tests/core/test_media_pipeline_integration.py -q
      - name: Require Telegram application credentials (Windows)
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: pwsh
        env:
          DOWNANY_TELEGRAM_API_ID: ${{ secrets.DOWNANY_TELEGRAM_API_ID }}
          DOWNANY_TELEGRAM_API_HASH: ${{ secrets.DOWNANY_TELEGRAM_API_HASH }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOWNANY_TELEGRAM_API_ID) -or [string]::IsNullOrWhiteSpace($env:DOWNANY_TELEGRAM_API_HASH)) {
            throw "DOWNANY_TELEGRAM_API_ID and DOWNANY_TELEGRAM_API_HASH GitHub Secrets are required for a formal package"
          }
      - name: Require Telegram application credentials (macOS)
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        env:
          DOWNANY_TELEGRAM_API_ID: ${{ secrets.DOWNANY_TELEGRAM_API_ID }}
          DOWNANY_TELEGRAM_API_HASH: ${{ secrets.DOWNANY_TELEGRAM_API_HASH }}
        run: |
          test -n "$DOWNANY_TELEGRAM_API_ID"
          test -n "$DOWNANY_TELEGRAM_API_HASH"
      - name: Install macOS build tools
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        run: brew install cmake gperf
      - name: Build Telegram Bot API (Windows)
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_telegram_bot_api_windows.ps1 -WorkspaceRoot $env:GITHUB_WORKSPACE
      - name: Build Telegram Bot API (macOS)
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        run: ./scripts/build_telegram_bot_api_macos.sh
      - name: Build ProcessHost (Windows)
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_process_host_windows.ps1
      - name: Build ProcessHost (macOS)
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        run: ./scripts/build_process_host_macos.sh
      - name: Smoke-test ProcessHost (Windows)
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: pwsh
        run: node scripts/test_process_host_windows.mjs --executable "$env:GITHUB_WORKSPACE\desktop\resources\process-host\DownanyProcessHost.exe"
      - name: Smoke-test ProcessHost (macOS)
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        run: python3 scripts/test_process_host.py --platform darwin --executable "$GITHUB_WORKSPACE/desktop/resources/process-host/DownanyProcessHost"
      - name: Generate local Bot API credentials (Windows)
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: pwsh
        env:
          DOWNANY_TELEGRAM_API_ID: ${{ secrets.DOWNANY_TELEGRAM_API_ID }}
          DOWNANY_TELEGRAM_API_HASH: ${{ secrets.DOWNANY_TELEGRAM_API_HASH }}
        run: >-
          node scripts/generate_telegram_build_credentials.mjs
          --output="$env:GITHUB_WORKSPACE\desktop\resources\telegram-bot-api\app-credentials.json"
      - name: Generate local Bot API credentials (macOS)
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        env:
          DOWNANY_TELEGRAM_API_ID: ${{ secrets.DOWNANY_TELEGRAM_API_ID }}
          DOWNANY_TELEGRAM_API_HASH: ${{ secrets.DOWNANY_TELEGRAM_API_HASH }}
        run: >-
          node scripts/generate_telegram_build_credentials.mjs
          --output="$GITHUB_WORKSPACE/desktop/resources/telegram-bot-api/app-credentials.json"
      - name: Build verified Windows installer
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: pwsh
        env:
          BUILD_TELEGRAM_NATIVE: "0"
          ALLOW_CLOUD_ONLY_PACKAGE: "0"
          FETCH_BINS: "0"
          BUILD_SIDECAR: "1"
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_windows_nsis.ps1
      - name: Build cloud-only Windows installer
        if: matrix.target == 'win32-x64' && (github.event_name != 'workflow_dispatch' || inputs.package_mode == 'cloud-only')
        shell: pwsh
        env:
          BUILD_TELEGRAM_NATIVE: "0"
          ALLOW_CLOUD_ONLY_PACKAGE: "1"
          FETCH_BINS: "0"
          BUILD_SIDECAR: "1"
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/build_windows_nsis.ps1
      - name: Build verified macOS disk image
        if: matrix.target == 'darwin-arm64' && github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        shell: bash
        env:
          BUILD_TELEGRAM_NATIVE: "0"
          ALLOW_CLOUD_ONLY_PACKAGE: "0"
          FETCH_BINS: "0"
          BUILD_SIDECAR: "1"
        run: ./scripts/build_macos_dmg.sh
      - name: Build cloud-only macOS disk image
        if: matrix.target == 'darwin-arm64' && (github.event_name != 'workflow_dispatch' || inputs.package_mode == 'cloud-only')
        shell: bash
        env:
          BUILD_TELEGRAM_NATIVE: "0"
          ALLOW_CLOUD_ONLY_PACKAGE: "1"
          FETCH_BINS: "0"
          BUILD_SIDECAR: "1"
        run: ./scripts/build_macos_dmg.sh
      - name: Smoke-test packaged media tools (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: node scripts/test_packaged_media_tools.mjs "--bin-dir=$env:GITHUB_WORKSPACE\desktop\release\win-unpacked\resources\bin"
      - name: Smoke-test packaged media tools (macOS)
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          packaged_bin="$(find "$GITHUB_WORKSPACE/desktop/release" -type d -path '*/Downany.app/Contents/Resources/bin' -print -quit)"
          test -n "$packaged_bin"
          node scripts/test_packaged_media_tools.mjs --bin-dir="$packaged_bin"
      - name: Smoke-test packaged Sidecar (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $sidecar = Get-ChildItem "$env:GITHUB_WORKSPACE\desktop\release" -Recurse -Filter DownanySidecar.exe | Select-Object -First 1
          if (-not $sidecar) { throw "packaged DownanySidecar.exe not found" }
          $data = Join-Path $env:RUNNER_TEMP "downany-sidecar-smoke"
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          node scripts/test_packaged_sidecar.mjs --executable="$($sidecar.FullName)" --data-dir="$data"
      - name: Smoke-test packaged Sidecar (macOS)
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          sidecar="$(find "$GITHUB_WORKSPACE/desktop/release" -type f -name DownanySidecar -perm -111 -print -quit)"
          test -n "$sidecar"
          mkdir -p "$RUNNER_TEMP/downany-sidecar-smoke"
          node scripts/test_packaged_sidecar.mjs --executable="$sidecar" --data-dir="$RUNNER_TEMP/downany-sidecar-smoke"
      - name: Smoke-test packaged Electron (Windows)
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: |
          $electron = Get-ChildItem "$env:GITHUB_WORKSPACE\desktop\release" -Recurse -Filter Downany.exe |
            Where-Object { $_.FullName -match "win-unpacked" } |
            Select-Object -First 1
          if (-not $electron) { throw "packaged Downany.exe not found" }
          node scripts/test_packaged_electron.mjs "--executable=$($electron.FullName)"
      - name: Record v0.3.1 Windows candidate
        if: matrix.target == 'win32-x64'
        shell: pwsh
        run: >-
          node scripts/record_v031_candidate_artifact.mjs
          --manifest=docs/acceptance/v0.3.1-candidate-artifacts.json
          --target=windows-x64
          --artifact=desktop\release\Downany-0.3.1-win-x64.exe
      - name: Install Windows upgrade gate runtime
        id: windows_upgrade_runtime
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "v031-playwright"
          npm.cmd install --prefix $root --no-save playwright@1.55.0
          if ($LASTEXITCODE -ne 0) { throw "Playwright installation failed" }
          "module=$root\node_modules\playwright" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Download official v0.3.0 Windows installer
        id: windows_upgrade_source
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $source = Join-Path $env:RUNNER_TEMP "Downany-0.3.0-win-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/JackEngineer/downany/releases/download/v0.3.0/Downany-0.3.0-win-x64.exe" -OutFile $source
          $hash = (Get-FileHash -LiteralPath $source -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "db2c3df75e9097573c3525c58e7a1c98ba276c29ad60faa22d6d7fef9adaa8cb") {
            throw "Official v0.3.0 installer checksum mismatch"
          }
          "artifact=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Verify v0.3.0 to v0.3.1 Windows upgrade
        if: matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: >-
          node scripts/run_v031_windows_upgrade.mjs
          "--source-artifact=${{ steps.windows_upgrade_source.outputs.artifact }}"
          "--candidate-artifact=$env:GITHUB_WORKSPACE\desktop\release\Downany-0.3.1-win-x64.exe"
          "--candidate-executable=$env:GITHUB_WORKSPACE\desktop\release\win-unpacked\Downany.exe"
          "--playwright-module=${{ steps.windows_upgrade_runtime.outputs.module }}"
          "--results=$env:GITHUB_WORKSPACE\docs\acceptance\v0.3.1-windows-upgrade-results.json"
      - name: Smoke-test packaged Electron (macOS)
        if: matrix.target == 'darwin-arm64'
        shell: bash
        run: |
          electron="$(find "$GITHUB_WORKSPACE/desktop/release" -type f -path '*/Downany.app/Contents/MacOS/Downany' -perm -111 -print -quit)"
          test -n "$electron"
          node scripts/test_packaged_electron.mjs --executable="$electron"
      - name: Upload native resources
        uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch' && inputs.package_mode == 'native'
        with:
          name: downany-native-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/resources/telegram-bot-api/**
            desktop/resources/process-host/**
      - name: Upload verified installer
        uses: actions/upload-artifact@v7
        with:
          name: downany-installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            desktop/release/**
            ${{ matrix.target == 'win32-x64' && 'docs/acceptance/v0.3.1-candidate-artifacts.json' || '' }}
            ${{ matrix.target == 'win32-x64' && github.event_name == 'workflow_dispatch' && 'docs/acceptance/v0.3.1-windows-upgrade-results.json' || '' }}
