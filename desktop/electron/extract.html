<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器抓取</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #1c1c1e;
        color: #f5f5f7;
      }
      .shell {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .toolbar {
        display: flex;
        gap: 8px;
        padding: 8px 10px;
        background: #2c2c2e;
        border-bottom: 1px solid #3a3a3c;
        align-items: center;
      }
      .toolbar input {
        flex: 1;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid #48484a;
        background: #1c1c1e;
        color: inherit;
      }
      .toolbar button {
        padding: 6px 12px;
        border-radius: 6px;
        border: 1px solid #48484a;
        background: #3a3a3c;
        color: inherit;
        cursor: pointer;
      }
      .toolbar button.primary {
        background: #0a84ff;
        border-color: #0a84ff;
      }
      .toolbar button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .browser {
        flex: 1 1 55%;
        min-height: 200px;
        border-bottom: 1px solid #3a3a3c;
      }
      webview.browser {
        width: 100%;
        height: 100%;
        border: none;
      }
      .panel {
        flex: 1 1 45%;
        display: flex;
        flex-direction: column;
        min-height: 160px;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 8px 10px;
        background: #2c2c2e;
        border-bottom: 1px solid #3a3a3c;
        font-size: 13px;
      }
      .list {
        flex: 1;
        overflow: auto;
        margin: 0;
        padding: 8px;
        list-style: none;
      }
      .list li {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        padding: 6px 4px;
        border-bottom: 1px solid #2c2c2e;
        font-size: 12px;
      }
      .list li label {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        flex: 1;
        cursor: pointer;
      }
      .type {
        flex-shrink: 0;
        padding: 2px 6px;
        border-radius: 4px;
        background: #3a3a3c;
        font-size: 11px;
        text-transform: uppercase;
      }
      .url {
        word-break: break-all;
        color: #aeaeb2;
      }
      .empty {
        padding: 16px;
        color: #8e8e93;
        font-size: 13px;
      }
      .status {
        padding: 4px 10px;
        font-size: 12px;
        color: #8e8e93;
        min-height: 22px;
      }
      .status.error {
        color: #ff453a;
      }
      .status.ok {
        color: #30d158;
      }
      .toolbar { padding: 12px 16px; gap: 10px; }
      .toolbar button { min-height: 36px; }
      .browser { flex: 1 1 58%; }
      .panel { flex: 1 1 42%; min-height: 210px; }
      .panel-header { padding: 12px 16px; gap: 12px; }
      .scope-tabs { display: flex; gap: 4px; margin-right: auto; }
      .scope-tabs button, .media-actions button { background: transparent; color: #aeaeb2; border: 0; border-radius: 6px; padding: 7px 10px; cursor: pointer; }
      .scope-tabs button[aria-pressed="true"] { background: #3a3a3c; color: #fff; }
      .list { padding: 8px 12px; }
      .list li.media-card { padding: 12px; margin: 0 0 6px; border: 1px solid transparent; border-radius: 10px; align-items: center; gap: 12px; background: #252527; }
      .list li.media-card.selected { background: #163550; border-color: #0a84ff; }
      .list li.media-card:focus-within { outline: 2px solid #78bfff; outline-offset: 1px; }
      .media-choice { min-width: 0; display: flex; align-items: center !important; gap: 14px !important; flex: 1; }
      .media-choice input { width: 18px; height: 18px; accent-color: #0a84ff; flex-shrink: 0; }
      .media-visual { position: relative; width: 112px; height: 66px; flex-shrink: 0; background: #343437; display: grid; place-items: center; border-radius: 6px; overflow: hidden; color: #aeaeb2; }
      .media-visual img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .media-body { flex: 1; min-width: 0; }
      .media-title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; line-height: 1.5; font-weight: 600; }
      .media-facts { font-size: 12px; color: #d1d1d6; margin-top: 5px; line-height: 1.6; }
      .media-source { font-size: 11px; color: #98989f; margin-top: 4px; overflow-wrap: anywhere; }
      .media-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
      .media-actions button { color: #78bfff; font-size: 12px; }
      .media-actions button:disabled { color: #85858b; cursor: default; }
      .added { color: #52d987; font-size: 12px; }
      .empty { display: flex !important; flex-direction: column; gap: 8px !important; border: 0 !important; padding: 24px 12px !important; }
      .empty strong { color: #e5e5ea; font-size: 14px; font-weight: 500; }
      .status { padding: 8px 16px; min-height: 30px; }
      @media (max-width: 850px) { .media-visual { width: 88px; height: 58px; } .media-actions { max-width: 100px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="toolbar">
        <input id="urlInput" type="url" placeholder="输入页面 URL…" />
        <button id="goBtn" type="button">前往</button>
        <button id="enqueueBtn" type="button" class="primary" disabled>下载已选 0 项</button>
      </div>
      <webview
        id="browser"
        class="browser"
        partition="persist:extract"
        allowpopups
        webpreferences="contextIsolation=yes"
      ></webview>
      <div class="panel">
        <div class="panel-header">
          <div class="scope-tabs"><button id="currentTab" type="button" aria-pressed="true">当前页 0</button><button id="historyTab" type="button" aria-pressed="false">之前页面 0</button></div>
          <span id="selectionCount" aria-live="polite">已选 0 项</span>
          <label><input id="selectAll" type="checkbox" /> 全选</label>
        </div>
        <ul id="mediaList" class="list"></ul>
        <div id="status" class="status"></div>
      </div>
    </div>
    <script src="extractView.js"></script>
  </body>
</html>
