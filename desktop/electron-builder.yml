appId: com.jacklee.downany
productName: Downany
executableName: Downany
copyright: Copyright © Jack Lee
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
      - "!**/.gitkeep"
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"
      - "!**/.gitkeep"
protocols:
  - name: Downany
    schemes:
      - downany
mac:
  icon: build/icon.png
  category: public.app-category.utilities
  target:
    - dmg
    - dir
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  extendInfo:
    # 仅改 DisplayName；CFBundleName 必须保持与 productName/Helper 一致，
    # 否则 Electron 会 FATAL: Unable to find helper app（启动即崩溃）。
    CFBundleDisplayName: Downany · 百纳
    # 允许把 URL / .webloc 拖到 Dock 图标（配合 main.ts 的 open-file 处理；需打包后真机验证）
    CFBundleDocumentTypes:
      - CFBundleTypeName: 网页链接
        CFBundleTypeRole: Viewer
        LSHandlerRank: Alternate
        LSItemContentTypes:
          - public.url
          - public.url-name
          - com.apple.web-internet-location
dmg:
  artifactName: Downany-${version}-mac.${ext}
  title: Downany · 百纳 ${version}
