appId: com.jacklee.videodownloader
productName: VideoDownloader
executableName: VideoDownloader
copyright: Copyright © Jack Lee
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
      - "!**/.gitkeep"
  - from: resources/sidecar
    to: sidecar
    filter:
      - "**/*"
      - "!**/.gitkeep"
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - dir
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: null
  extendInfo:
    CFBundleDisplayName: 视频下载器
    CFBundleName: 视频下载器
dmg:
  artifactName: VideoDownloader-${version}-mac.${ext}
  title: 视频下载器 ${version}
